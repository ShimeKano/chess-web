name: Validate chess-web

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/opening-coach-node24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate opening lesson JSON and SAN lines
        run: node scripts/validate-opening-lessons.mjs
      - name: Build
        run: npm run build
